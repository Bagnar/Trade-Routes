# Реестр официальных источников — белый список конвейера.
# Это главный актив проекта и единственная постоянная ручная работа.
# Правила:
#   - только официальные органы и международные организации; блоги, форумы, брокеры, перевозчики — никогда;
#   - status: to_verify — запись ещё не открывали руками; verified — домен и роль подтверждены; unstable — доступен нестабильно;
#   - urls: конкретные страницы по темам, заполняются на этапе 0 (пока пусто — конвейер их не использует);
#   - priority: 1 — первичный источник по теме, 2 — дополняющий, 3 — справочный.
# Все записи ниже — предложения, составленные до проверки. Домены и роли подтвердить на этапе 0.

