name: Corridor requests

# The corridor request queue (docs/expansion-plan.md, 1.9). "Запросить коридор" on the site opens a GitHub issue
# with the label `corridor-request`; this workflow reads the open issues, keeps data/requests.json, creates a
# blank page for every request whose countries and HS-6 are recognised, runs the assembler (facts and rates
# already collected apply immediately) and commits. The issue stays open until a person closes it.

on:
  issues:
    types: [opened, edited, labeled]
  workflow_dispatch:
  schedule:
    - cron: "45 5 * * *"   # daily, after the source check

permissions:
  contents: write
  issues: read

jobs:
  queue:
    if: ${{ github.event_name != 'issues' || contains(github.event.issue.labels.*.name, 'corridor-request') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Read the queue and create blank pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m pipeline requests --sync --apply
      - name: Assemble and validate
        run: |
          python -m pipeline assemble
          python -m pipeline validate
      - name: Commit
        run: |
          git config user.name "trade-rules-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A data/requests.json web/data/pages
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "Corridor requests: $(date -u +%F)"; git push; fi
