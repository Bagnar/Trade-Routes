name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  web:
    name: web (typecheck, lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  pipeline:
    name: pipeline (tests, validators)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q pipeline/tests
      - run: python -m pipeline validate

  schema:
    name: db/schema.sql applies on PostgreSQL 16
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trade
          POSTGRES_PASSWORD: trade
          POSTGRES_DB: trade
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trade -d trade" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - run: psql "postgresql://trade:trade@localhost:5432/trade" -v ON_ERROR_STOP=1 -f db/schema.sql
