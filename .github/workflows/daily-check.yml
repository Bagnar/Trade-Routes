name: Daily source check

# The site's "AI re-check" (docs/concept.md, section 6.4). Runs from GitHub, where official sites are reachable:
#  1. monitor  — re-reads every source behind a published fact and checks the quote is still there (no LLM);
#  2. extract  — optional: if ANTHROPIC_API_KEY is set as a repository secret, extracts new facts from every URL
#                listed under `urls` in data/sources.yaml into data/facts (each fact carries a verbatim quote);
#  3. validate — whitelist, quotes, numbers, sanctions wording;
#  4. commits stamp changes, the report and new facts back to the branch that ran the workflow.

on:
  schedule:
    - cron: "17 5 * * *"   # daily 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"

      - name: Tests first, so a failing test never discards extracted facts
        run: python -m pytest -q pipeline/tests

      - name: Re-check quotes behind published facts
        id: monitor
        run: |
          set +e
          python -m pipeline monitor
          code=$?
          set -e
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          test "$code" -eq 0 -o "$code" -eq 3

      - name: Extract facts from registry URLs (only when an API key is configured)
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PIPELINE_MODEL: ${{ vars.PIPELINE_MODEL || 'claude-opus-5' }}   # repository variable; claude-sonnet-5 is cheaper
          PIPELINE_MAX_PAGES: ${{ vars.PIPELINE_MAX_PAGES || '40' }}      # hard cap on model calls per run
          PIPELINE_MAX_USD: ${{ vars.PIPELINE_MAX_USD || '5' }}           # estimated dollars per run, from API token counts
          PIPELINE_MONTHLY_USD: ${{ vars.PIPELINE_MONTHLY_USD || '15' }}  # per calendar month, ledger data/usage.json
        run: python -m pipeline extract --registry --batch

      - name: Import statistics for new pairs (UN Comtrade public API, cached 30 days)
        env:
          DEMAND_MAX_CALLS: ${{ vars.DEMAND_DAILY_MAX_CALLS || '120' }}
        run: python -m pipeline demand --load

      - name: Assemble pages from facts and rates
        run: python -m pipeline assemble

      - name: Validate pages
        run: python -m pipeline validate

      - name: Commit changes
        run: |
          git config user.name "trade-rules-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A web/data data/monitor-report.md
          test -f data/usage.json && git add -A data/usage.json data/extract-report.md
          test -d data/facts && git add -A data/facts
          test -d data/demand && git add -A data/demand
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "Daily source check: $(date -u +%F)"
            git pull --rebase origin "$GITHUB_REF_NAME" && git push
          fi
