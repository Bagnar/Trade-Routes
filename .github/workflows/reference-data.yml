name: Reference data

# Loads reference tables from official databases (no LLM, no cost) and commits them:
#   data/hs6.json      — HS-6 nomenclature (UN Comtrade reference list H6)
#   data/rates/*.json  — MFN applied tariffs by HS-6 per importer (World Bank WITS / UNCTAD TRAINS)
#   data/agreements.json — regional trade agreements in force (WTO RTA-IS)
# Runs monthly and on demand. Network is open here; it is closed in the Claude Code cloud session.

on:
  schedule:
    - cron: "41 4 1 * *"   # 1st of each month, 04:41 UTC
  workflow_dispatch:
    inputs:
      rates_reporters:
        description: "ISO codes of importers to load MFN rates for (comma-separated), empty = skip"
        default: "CA,CN,RU,IR,TR"
      probe:
        description: "Diagnostics: ISO2 of one country to probe WITS URL shapes for (empty = off)"
        default: ""
      demand_probe:
        description: "Diagnostics: ISO2 codes to check trade-statistics freshness for (WITS vs UN Comtrade), empty = off"
        default: ""

permissions:
  contents: write

jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: HS-6 nomenclature
        run: python -m pipeline reference
      - name: Probe WITS endpoint (diagnostics)
        if: ${{ github.event.inputs.probe != '' }}
        run: python -m pipeline rates --probe "${{ github.event.inputs.probe }}"
      - name: Probe trade-statistics freshness (diagnostics)
        if: ${{ github.event.inputs.demand_probe != '' }}
        run: python -m pipeline demand --probe "${{ github.event.inputs.demand_probe }}"
      - name: MFN rates by HS-6
        if: ${{ github.event.inputs.rates_reporters != '' }}
        run: python -m pipeline rates --wits "${{ github.event.inputs.rates_reporters || 'CA,CN,RU,IR,TR' }}"
      - name: Trade agreements in force (WTO RTA-IS)
        run: python -m pipeline agreements
      - name: Tests
        run: python -m pytest -q pipeline/tests
      - name: Commit
        run: |
          git config user.name "trade-rules-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A data/hs6.json
          test -f data/agreements.json && git add -A data/agreements.json
          test -d data/rates && git add -A data/rates
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "Reference data: $(date -u +%F)"; git pull --rebase origin "$GITHUB_REF_NAME" && git push; fi
