name: Reference data

# Loads reference tables from official databases (no LLM, no cost) and commits them:
#   data/hs6.json      — HS-6 nomenclature (UN Comtrade reference list H6)
#   data/rates/*.json  — MFN applied tariffs by HS-6 per importer (World Bank WITS / UNCTAD TRAINS)
#   data/agreements.json — regional trade agreements in force (WTO RTA-IS)
#   data/demand/*.json  — import statistics by HS-6 per importer (UN Comtrade public API), 30-day cache
# Runs monthly and on demand. Network is open here; it is closed in the Claude Code cloud session.

on:
  schedule:
    - cron: "41 4 1 * *"   # 1st of each month, 04:41 UTC
  workflow_dispatch:
    inputs:
      rates_reporters:
        description: "ISO codes of importers to load MFN rates for (comma-separated), empty = skip"
        default: "CA,CN,RU,IR,TR,KZ,UZ,AE,DE,US,IN,VN,BR"
      probe:
        description: "Diagnostics: ISO2 of one country to probe WITS URL shapes for (empty = off)"
        default: ""
      hs_ru_probe:
        description: "Diagnostics: probe the ЕТТ ЕАЭС page for the tariff spreadsheet (true/false)"
        default: "false"
      demand_probe:
        description: "Diagnostics: ISO2 codes to check trade-statistics freshness for (WITS vs UN Comtrade), empty = off"
        default: ""
      agreements_probe:
        description: "Diagnostics: print raw RTA-IS export rows containing this text (e.g. ASEAN), empty = off"
        default: ""

permissions:
  contents: write

jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Tests first, so a failing test never discards loaded data
        run: python -m pytest -q pipeline/tests
      - name: Probe the ЕТТ ЕАЭС page (diagnostics)
        if: ${{ github.event.inputs.hs_ru_probe == 'true' }}
        run: python -m pipeline reference --probe-ru
      - name: HS-6 nomenclature
        env:
          HS_RU_SOURCE_URL: ${{ vars.HS_RU_SOURCE_URL }}   # ЕТТ page or its spreadsheet; empty = English names only
        run: python -m pipeline reference
      - name: Probe WITS endpoint (diagnostics)
        if: ${{ github.event.inputs.probe != '' }}
        run: python -m pipeline rates --probe "${{ github.event.inputs.probe }}"
      - name: Probe trade-statistics freshness (diagnostics)
        if: ${{ github.event.inputs.demand_probe != '' }}
        run: python -m pipeline demand --probe "${{ github.event.inputs.demand_probe }}"
      - name: Probe the RTA-IS export (diagnostics)
        if: ${{ github.event.inputs.agreements_probe != '' }}
        run: python -m pipeline agreements --probe "${{ github.event.inputs.agreements_probe }}"
      - name: MFN rates by HS-6
        if: ${{ github.event_name == 'schedule' || github.event.inputs.rates_reporters != '' }}
        run: python -m pipeline rates --wits "${{ github.event.inputs.rates_reporters || 'CA,CN,RU,IR,TR,KZ,UZ,AE,DE,US,IN,VN,BR' }}"
      - name: Trade agreements in force (WTO RTA-IS)
        run: python -m pipeline agreements
      - name: Import statistics for the site's pairs (UN Comtrade public API, no key)
        env:
          DEMAND_MAX_CALLS: ${{ vars.DEMAND_MAX_CALLS || '400' }}
        run: python -m pipeline demand --load
      - name: Commit
        run: |
          git config user.name "trade-rules-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A data/hs6.json
          test -f data/agreements.json && git add -A data/agreements.json
          test -d data/rates && git add -A data/rates
          test -d data/demand && git add -A data/demand
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "Reference data: $(date -u +%F)"; git pull --rebase origin "$GITHUB_REF_NAME" && git push; fi
